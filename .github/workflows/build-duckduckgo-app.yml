name: Build DuckDuckGo Engine APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب مستودع DuckDuckGo
      - name: Checkout DuckDuckGo Android Repository
        uses: actions/checkout@v4
        with:
          repository: 'duckduckgo/android'
          ref: 'main'

      # 2. إعداد بيئة Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. إعداد البيئة وتخصيص الذاكرة
      - name: Prepare Build Environment & Properties
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "org.gradle.jvmargs=-Xmx6144m -XX:+UseG1GC" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

      # 4. إعطاء صلاحيات التشغيل
      - name: Grant Execute Permission
        run: chmod +x gradlew

      # 5. تجميع الـ APK (بدون -x detekt)
      - name: Build App APK
        run: |
          ./gradlew :app:assembleInternalDebug -x test -x lint --no-daemon

      # 6. رفع ملف الـ APK الناتج
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDuckGo-Engine-APK
          path: app/build/outputs/apk/**/*.apk
