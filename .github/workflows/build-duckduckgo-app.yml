name: Build DuckDuckGo Core Engine APK

on:
  workflow_dispatch: # تشغيل يدوياً بضغطة زر

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب مستودع DuckDuckGo الرسمي
      - name: Checkout DuckDuckGo Android Repository
        uses: actions/checkout@v4
        with:
          repository: 'duckduckgo/android'
          ref: 'main'

      # 2. إعداد بيئة Java 17 المتوافقة مع المشروع
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. إعطاء صلاحيات التشغيل وتخصيص ذاكرة أسرع لـ Gradle
      - name: Grant execute permission for gradlew & Setup Memory
        run: |
          chmod +x gradlew
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

      # 4. تجميع تطبيق الـ APK الصافي بدون تشغيل الاختبارات المعرقلة
      - name: Build App APK
        run: |
          ./gradlew :app:assembleDebug -x test -x lint --stacktrace

      # 5. رفع ملف الـ APK الناتج ليكون جاهزاً للتحميل والتجربة
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDuckGo-Engine-APK
          path: app/build/outputs/apk/debug/*.apk
